<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — V Royals Studio</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <link rel="stylesheet" href="css/vroyals_theme.css">
  <style>
    .auth-container { max-width: 400px; margin: 160px auto; padding: 2.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .auth-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.85rem; color: var(--muted); }
    .form-group input { background: var(--surface2); border: 1px solid var(--border); padding: 0.85rem; border-radius: 8px; color: var(--text); outline: none; transition: var(--transition); }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,197,24,0.1); }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: #fff; color: #000; padding: 0.85rem; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 1rem; transition: var(--transition); }
    .google-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
    .auth-divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--muted); font-size: 0.75rem; }
    .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  </style>
</head>
<body>
<nav id="main-nav">
  <a href="index.html" class="logo">V<em> Royals</em> Studio</a>
  <a href="index.html" style="font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;">← Back to Home</a>
</nav>

<div class="auth-container reveal">
  <h2 style="margin-bottom:0.5rem">Welcome Back</h2>
  <p style="color:var(--muted); font-size:0.9rem; margin-bottom:2rem">Sign in to access your private projects and security audits.</p>
  
  <a href="/api/auth/google" class="google-btn">
    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" alt="G">
    Continue with Google
  </a>

  <p style="text-align:center; margin-top:2rem; font-size:0.8rem; color:var(--muted); line-height:1.5">
    By signing in, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>.
  </p>
</div>

<footer class="site-footer">
  <div class="footer-bottom"><p>© 2025 V Royals Studio. <a href="terms.html">Terms</a> · <a href="privacy-policy.html">Privacy</a></p></div>
</footer>
<script src="js/shared.js"></script>
</body>
</html>
