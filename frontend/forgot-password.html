<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your password for V Royals Studio.">
  <title>Forgot Password — V Royals Studio</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vroyals_theme.css">
</head>
<body class="auth-page">

  <a href="index.html" class="auth-back-link" style="position: absolute; top: 30px; left: 30px; color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; transition: var(--transition); z-index: 10;">
    <span style="font-size: 1.2rem;">←</span> Back to Home
  </a>

  <div class="auth-card">
    <div class="auth-header" id="reset-header">
      <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;">V<em> Royals</em></a>
      <h2>Reset Password</h2>
      <p>Enter your email and we'll send you a link to reset your password.</p>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 50px;">Send Reset Link</button>
    </form>

    <div id="success-msg" style="display: none; text-align: center; padding: 20px 0;">
       <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
       <h3 style="margin-bottom: 0.5rem; color: #fff;">Check your inbox</h3>
       <p style="color: var(--muted); font-size: 0.95rem;">If an account exists for that email, we've sent instructions to reset your password.</p>
       <a href="login.html" class="btn btn-ghost" style="margin-top: 1.5rem; width: 100%; justify-content: center;">Back to Login</a>
    </div>

    <p class="auth-footer-text" id="forgot-footer">
      Remembered your password? <a href="login.html" class="auth-link">Login</a>
    </p>
  </div>

  <script src="js/shared.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      const header = document.getElementById('reset-header');
      const footer = document.getElementById('forgot-footer');
      const success = document.getElementById('success-msg');

      btn.innerHTML = 'Sending...';
      btn.disabled = true;

      setTimeout(() => {
        form.style.display = 'none';
        header.style.display = 'none';
        footer.style.display = 'none';
        success.style.display = 'block';
      }, 1500);
    });
  </script>
</body>
</html>
